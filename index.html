<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>City EV Fleet | Electric Car Rentals</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#fff;
    color:#111;
}

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4%;
    background:#fff;
    border-bottom:1px solid #eee;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    font-size:42px;
}

.logo h1{
    font-size:30px;
}

.logo h1 span{
    color:#0b9b43;
}

.logo p{
    font-size:13px;
    color:#555;
}

nav{
    display:flex;
    gap:32px;
    align-items:center;
}

nav a{
    text-decoration:none;
    color:#222;
    font-size:15px;
}

nav a:first-child{
    color:#087d38;
    font-weight:bold;
    border-bottom:3px solid #0b9b43;
    padding-bottom:23px;
}

.whatsapp{
    display:flex;
    align-items:center;
    gap:10px;
}

.whatsapp-icon{
    background:#0b9b43;
    color:#fff;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:23px;
}

.whatsapp strong{
    display:block;
}

.whatsapp small{
    color:#555;
}

.book-btn{
    background:#099b43;
    color:white;
    border:0;
    padding:13px 25px;
    border-radius:5px;
    font-weight:bold;
    font-size:15px;
}

/* HERO */

.hero{
    min-height:375px;
    background:
        linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.2)),
        url("hero-bg.png") center/cover;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:35px 4%;
}

.hero-content{
    color:#fff;
    max-width:700px;
}

.hero-content h2{
    font-size:52px;
    line-height:1.05;
}

.hero-content h2 span{
    color:#54ef25;
}

.hero-content h3{
    margin-top:18px;
    font-size:23px;
}

.hero-content p{
    margin-top:12px;
    font-size:18px;
}

.features{
    display:flex;
    gap:20px;
    margin-top:25px;
}

.feature{
    display:flex;
    align-items:center;
    gap:8px;
}

.feature-icon{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#62ed26;
    color:#063d1b;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

/
